services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/collegehub-backend:latest
    container_name: collegehub-backend
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/collegehub-frontend:latest
    container_name: collegehub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend